/* ================================================================
   SHEETS – app
   ================================================================ */
const MAX_ROWS=5000, MAX_COLS=100;
const newSheet=name=>({name, rows:100, cols:26, cells:{}, freeze:false});
const books=new FileSet('azh.book', ()=>({sheets:[newSheet('Sheet1')], active:0}));
const grid=$('#grid'), wrap=$('#gridWrap'), ed=$('#cellEditor'), fbar=$('#fbar');
let book, act={r:0,c:0}, ext={r:0,c:0}, editing=null, undoStack=[], redoStack=[], bookTimer=null, clip=null, lastPointer='mouse', dragging=false, fbarCell=null;

const sh=()=>book.sheets[book.active];
const recalc=()=>recalcSheet(sh());
const cellObj=(r,c)=>sh().cells[K(r,c)];
const raw=(r,c)=>{ const x=cellObj(r,c); return x && x.v!=null ? String(x.v) : ''; };
const norm=()=>({r1:Math.min(act.r,ext.r), c1:Math.min(act.c,ext.c), r2:Math.max(act.r,ext.r), c2:Math.max(act.c,ext.c)});
const tdAt=(r,c)=>grid.tBodies[0]?.rows[r]?.cells[c+1];
const clampP=p=>({r:Math.max(0,Math.min(sh().rows-1,p.r)), c:Math.max(0,Math.min(sh().cols-1,p.c))});

function loadBook(){
  book=books.load();
  if(!book || !Array.isArray(book.sheets) || !book.sheets.length) book={sheets:[newSheet('Sheet1')], active:0};
  if(!(book.active>=0 && book.active<book.sheets.length)) book.active=0;
  undoStack=[]; redoStack=[]; act={r:0,c:0}; ext={r:0,c:0};
  books.fill($('#bookList')); renderGrid();
}
function saveBook(){ clearTimeout(bookTimer); bookTimer=setTimeout(()=>{ bookTimer=null; if(!books.save(book)) toast('Storage full – use Save .xlsx or Backup'); }, 300); }
function flushBook(){ if(bookTimer){ clearTimeout(bookTimer); bookTimer=null; books.save(book); } }
function pushUndo(){ undoStack.push(JSON.stringify(book)); if(undoStack.length>40) undoStack.shift(); redoStack=[]; }
function undo(){ if(!undoStack.length) return toast('Nothing to undo'); redoStack.push(JSON.stringify(book)); book=JSON.parse(undoStack.pop()); afterChange(); }
function redo(){ if(!redoStack.length) return; undoStack.push(JSON.stringify(book)); book=JSON.parse(redoStack.pop()); afterChange(); }
function afterChange(){ act=clampP(act); ext=clampP(ext); saveBook(); renderGrid(); }

function cleanCell(k){
  const cells=sh().cells, x=cells[k]; if(!x) return;
  if(x.s){ for(const p in x.s) if(x.s[p]===undefined || x.s[p]===false || x.s[p]==='') delete x.s[p]; if(!Object.keys(x.s).length) delete x.s; }
  if((x.v==null || x.v==='') && !x.s) delete cells[k];
}
function setCell(r,c,v){
  const s=sh(), k=K(r,c), x=s.cells[k] || {v:''};
  x.v=v; s.cells[k]=x;
  if(typeof v==='string' && !(x.s && x.s.fmt)){
    const t=v.trim(); let f=null;
    if(/^[-+]?\d+(\.\d+)?%$/.test(t)) f='pct';
    else if(parseDateText(t)!==null) f='date';
    else if(/^=.*\b(TODAY|NOW)\s*\(/i.test(t)) f='date';
    if(f){ x.s=x.s||{}; x.s.fmt=f; }
  }
  cleanCell(k);
}

function renderGrid(){
  const s=sh(); recalc();
  grid.style.width=(46+100*s.cols)+'px';
  let h='<thead><tr><th class="corner" title="Select all"></th>';
  for(let c=0;c<s.cols;c++) h+=`<th class="colh" data-c="${c}">${colName(c)}</th>`;
  h+='</tr></thead><tbody>';
  const f=s.filter;
  for(let r=0;r<s.rows;r++){
    let hide=false;
    if(f && !(s.freeze && r===0)){ const fx=s.cells[K(r,f.c)]; hide=!display(val(r,f.c), fx && fx.s && fx.s.fmt).toLowerCase().includes(f.text.toLowerCase()); }
    h+=`<tr${hide?' hidden':''}${r===0&&s.freeze?' class="frozen"':''}><th class="rowh" data-r="${r}">${r+1}</th>`;
    for(let c=0;c<s.cols;c++){
      const x=s.cells[K(r,c)];
      if(!x){ h+='<td></td>'; continue; }
      const st=x.s||{}, v=val(r,c);
      const cls=typeof v==='number'?'n':isErr(v)?'e':typeof v==='boolean'?'b':'';
      let style='';
      if(st.b) style+='font-weight:700;'; if(st.i) style+='font-style:italic;'; if(st.u) style+='text-decoration:underline;';
      if(st.color) style+=`color:${st.color};`; if(st.bg) style+=`background-color:${st.bg};`; if(st.align) style+=`text-align:${st.align};`;
      h+=`<td${cls?` class="${cls}"`:''}${style?` style="${style}"`:''}>${esc(display(v, st.fmt))}</td>`;
    }
    h+='</tr>';
  }
  grid.innerHTML=h+'</tbody>';
  $('#sheetTabs').innerHTML=book.sheets.map((x,i)=>`<button class="stab${i===book.active?' active':''}" data-i="${i}">${esc(x.name)}</button>`).join('');
  $('#sFilter').textContent = s.filter ? `Clear filter (${colName(s.filter.c)})` : 'Filter';
  $('#sFilter').classList.toggle('on', !!s.filter);
  $('#sFreeze').classList.toggle('on', !!s.freeze);
  selChanged(false);
}

function paintSel(){
  grid.querySelectorAll('.sel,.cur,.hsel').forEach(e=>e.classList.remove('sel','cur','hsel'));
  const b=grid.tBodies[0]; if(!b) return;
  const {r1,c1,r2,c2}=norm();
  for(let r=r1;r<=r2;r++){ const tr=b.rows[r]; if(!tr) continue; tr.cells[0].classList.add('hsel'); for(let c=c1;c<=c2;c++) tr.cells[c+1]?.classList.add('sel'); }
  tdAt(act.r,act.c)?.classList.add('cur');
  const hr=grid.tHead.rows[0]; for(let c=c1;c<=c2;c++) hr.cells[c+1]?.classList.add('hsel');
}
function selChanged(scroll=true){
  paintSel();
  const {r1,c1,r2,c2}=norm();
  $('#cellName').textContent = (r1===r2 && c1===c2) ? colName(c1)+(r1+1) : `${colName(c1)}${r1+1}:${colName(c2)}${r2+1}`;
  if(document.activeElement!==fbar) fbar.value=raw(act.r,act.c);
  const x=cellObj(act.r,act.c), st=(x && x.s) || {};
  $('#sFmt').value=st.fmt||'gen';
  $('#sBold').classList.toggle('on',!!st.b); $('#sItal').classList.toggle('on',!!st.i); $('#sUnder').classList.toggle('on',!!st.u);
  updateStatus();
  if(scroll){ const td=(ext.r!==act.r||ext.c!==act.c) ? tdAt(ext.r,ext.c) : tdAt(act.r,act.c); td?.scrollIntoView({block:'nearest', inline:'nearest'}); }
}
function updateStatus(){
  const {r1,c1,r2,c2}=norm(); const n=(r2-r1+1)*(c2-c1+1); let txt='';
  if(n>1 && n<=200000){
    let sum=0, cnt=0, all=0;
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ if(!sh().cells[K(r,c)]) continue; const v=val(r,c); if(v!=null && v!=='') all++; if(typeof v==='number'){ sum+=v; cnt++; } }
    txt=`Sum: ${fmtGeneral(sum)}   Average: ${cnt?fmtGeneral(sum/cnt):'–'}   Count: ${all}`;
  }
  $('#sStatus').textContent = txt || `${books.cur().name} › ${sh().name}`;
}
function isHidden(r){ return !!grid.tBodies[0]?.rows[r]?.hidden; }
function move(dr,dc){
  let r=act.r+dr, c=act.c+dc; const s=sh();
  while(dr && r>=0 && r<s.rows && isHidden(r)) r+=dr;
  act=clampP({r,c}); ext={...act}; selChanged();
}

/* --- Editing --- */
function startEdit(initial){
  const td=tdAt(act.r,act.c); if(!td) return;
  editing={r:act.r, c:act.c};
  const wr=wrap.getBoundingClientRect(), tr=td.getBoundingClientRect();
  Object.assign(ed.style, {left:(tr.left-wr.left+wrap.scrollLeft)+'px', top:(tr.top-wr.top+wrap.scrollTop)+'px', width:Math.max(tr.width,140)+'px', height:tr.height+'px'});
  ed.value = initial!==undefined ? initial : raw(act.r,act.c);
  ed.hidden=false; ed.focus(); const n=ed.value.length; ed.setSelectionRange(n,n);
  fbar.value=ed.value;
}
function commitEdit(dr=0, dc=0, doMove=true){
  if(!editing) return;
  const {r,c}=editing, v=ed.value; editing=null; ed.hidden=true;
  if(v!==raw(r,c)){ pushUndo(); setCell(r,c,v); afterChange(); }
  if(doMove){ move(dr,dc); wrap.focus({preventScroll:true}); }
}
function cancelEdit(){ editing=null; ed.hidden=true; fbar.value=raw(act.r,act.c); wrap.focus({preventScroll:true}); }
ed.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); commitEdit(e.shiftKey?-1:1, 0); }
  else if(e.key==='Tab'){ e.preventDefault(); commitEdit(0, e.shiftKey?-1:1); }
  else if(e.key==='Escape'){ e.preventDefault(); cancelEdit(); }
});
ed.addEventListener('input', ()=>{ fbar.value=ed.value; });
ed.addEventListener('blur', ()=>commitEdit(0,0,false));

fbar.addEventListener('focus', ()=>{ commitEdit(0,0,false); fbarCell={...act}; });
function commitFbar(){ if(!fbarCell) return; const {r,c}=fbarCell; if(fbar.value!==raw(r,c)){ pushUndo(); setCell(r,c,fbar.value); afterChange(); } }
fbar.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ e.preventDefault(); commitFbar(); fbarCell=null; move(1,0); wrap.focus({preventScroll:true}); }
  else if(e.key==='Escape'){ e.preventDefault(); fbarCell=null; fbar.value=raw(act.r,act.c); wrap.focus({preventScroll:true}); }
});
fbar.addEventListener('blur', ()=>{ commitFbar(); fbarCell=null; });

/* --- Mouse / touch selection --- */
function cellFromTd(td){ return {r:td.parentElement.sectionRowIndex, c:td.cellIndex-1}; }
grid.addEventListener('pointerdown', e=>{
  lastPointer=e.pointerType;
  if(e.pointerType!=='mouse' || e.button!==0) return;
  const td=e.target.closest('td'); if(!td) return;
  const p=cellFromTd(td);
  commitEdit(0,0,false);
  if(e.shiftKey) ext=p; else { act=p; ext={...p}; }
  dragging=true; selChanged(false); wrap.focus({preventScroll:true});
  e.preventDefault();
});
grid.addEventListener('pointerover', e=>{ if(!dragging) return; const td=e.target.closest('td'); if(!td) return; ext=cellFromTd(td); selChanged(false); });
window.addEventListener('pointerup', ()=>{ dragging=false; });
grid.addEventListener('click', e=>{
  const th=e.target.closest('th'), td=e.target.closest('td'), s=sh();
  if(th){
    commitEdit(0,0,false);
    if(th.classList.contains('corner')){ act={r:0,c:0}; ext={r:s.rows-1,c:s.cols-1}; }
    else if(th.classList.contains('colh')){ const c=+th.dataset.c; act={r:0,c}; ext={r:s.rows-1,c}; }
    else if(th.classList.contains('rowh')){ const r=+th.dataset.r; act={r,c:0}; ext={r,c:s.cols-1}; }
    selChanged(false); wrap.focus({preventScroll:true}); return;
  }
  if(td && lastPointer!=='mouse'){        // touch: tap selects, tap again edits
    const p=cellFromTd(td);
    if(act.r===p.r && act.c===p.c && ext.r===p.r && ext.c===p.c) startEdit();
    else { commitEdit(0,0,false); act=p; ext={...p}; selChanged(false); }
  }
});
grid.addEventListener('dblclick', e=>{ if(e.target.closest('td') && lastPointer==='mouse') startEdit(); });

/* --- Keyboard --- */
wrap.addEventListener('keydown', e=>{
  if(editing || e.target!==wrap) return;
  const k=e.key, mod=e.ctrlKey||e.metaKey;
  if(mod){
    const l=k.toLowerCase();
    if(l==='z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if(l==='y'){ e.preventDefault(); redo(); }
    else if(l==='b'){ e.preventDefault(); toggleStyle('b'); }
    else if(l==='i'){ e.preventDefault(); toggleStyle('i'); }
    else if(l==='u'){ e.preventDefault(); toggleStyle('u'); }
    else if(l==='a'){ e.preventDefault(); act={r:0,c:0}; ext={r:sh().rows-1,c:sh().cols-1}; selChanged(false); }
    return;
  }
  const mv={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[k];
  if(mv){ e.preventDefault(); if(e.shiftKey){ ext=clampP({r:ext.r+mv[0], c:ext.c+mv[1]}); selChanged(); } else move(mv[0],mv[1]); return; }
  if(k==='Enter' || k==='F2'){ e.preventDefault(); startEdit(); return; }
  if(k==='Tab'){ e.preventDefault(); move(0, e.shiftKey?-1:1); return; }
  if(k==='Delete' || k==='Backspace'){ e.preventDefault(); clearRange(); return; }
  if(k.length===1 && !e.altKey){ e.preventDefault(); startEdit(k); }
});
function clearRange(){
  const {r1,c1,r2,c2}=norm(); pushUndo();
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ const k=K(r,c), x=sh().cells[k]; if(x){ x.v=''; cleanCell(k); } }
  afterChange();
}

/* --- Copy / cut / paste --- */
const sheetKeysActive=()=>document.body.dataset.app==='sheet' && !editing && document.activeElement===wrap;
function selTSV(){ const {r1,c1,r2,c2}=norm(); const rows=[]; for(let r=r1;r<=r2;r++){ const row=[]; for(let c=c1;c<=c2;c++) row.push(raw(r,c).replace(/[\t\r\n]+/g,' ')); rows.push(row.join('\t')); } return rows.join('\n'); }
document.addEventListener('copy', e=>{ if(!sheetKeysActive()) return; const t=selTSV(); const {r1,c1}=norm(); clip={tsv:t, r:r1, c:c1}; e.clipboardData.setData('text/plain', t); e.preventDefault(); });
document.addEventListener('cut', e=>{ if(!sheetKeysActive()) return; const t=selTSV(); clip=null; e.clipboardData.setData('text/plain', t); e.preventDefault(); clearRange(); });
document.addEventListener('paste', e=>{
  if(!sheetKeysActive()) return;
  const t=e.clipboardData.getData('text/plain'); if(!t) return; e.preventDefault();
  const rows=t.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));
  const internal=clip && clip.tsv===t, s=sh(), {r1,c1}=norm();
  pushUndo();
  rows.forEach((row,i)=>row.forEach((v,j)=>{
    const r=r1+i, c=c1+j; if(r>=MAX_ROWS || c>=MAX_COLS) return;
    if(r>=s.rows) s.rows=r+1; if(c>=s.cols) s.cols=c+1;
    setCell(r, c, internal ? offsetFormula(v, r1-clip.r, c1-clip.c) : v);
  }));
  act={r:r1,c:c1}; ext=clampP({r:r1+rows.length-1, c:c1+Math.max(...rows.map(x=>x.length))-1});
  afterChange();
});

/* --- Formatting --- */
function forRange(fn){
  pushUndo(); const {r1,c1,r2,c2}=norm(), cells=sh().cells;
  for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++){ const k=K(r,c); const x=cells[k]||{v:''}; x.s=x.s||{}; fn(x.s); cells[k]=x; cleanCell(k); }
  afterChange();
}
function toggleStyle(p){ const x=cellObj(act.r,act.c); const on=!(x && x.s && x.s[p]); forRange(s=>{ if(on) s[p]=true; else delete s[p]; }); }
const sheetTb=$('#sheetToolbar');
sheetTb.addEventListener('mousedown', e=>{ if(e.target.closest('button')) e.preventDefault(); });
$('#sUndo').onclick=undo; $('#sRedo').onclick=redo;
$('#sBold').onclick=()=>toggleStyle('b'); $('#sItal').onclick=()=>toggleStyle('i'); $('#sUnder').onclick=()=>toggleStyle('u');
$('#sColor').onchange=e=>forRange(s=>{ s.color=e.target.value; });
$('#sFill').onchange=e=>forRange(s=>{ s.bg=e.target.value; });
$$('#sheetToolbar [data-align]').forEach(b=>b.onclick=()=>forRange(s=>{ s.align=b.dataset.align; }));
$('#sFmt').onchange=e=>{ const f=e.target.value; forRange(s=>{ if(f==='gen') delete s.fmt; else s.fmt=f; }); };
$('#sClearFmt').onclick=()=>forRange(s=>{ for(const p in s) delete s[p]; });

/* --- Rows & columns --- */
function shiftStructure(axis, at, delta){
  const s=sh(), out={};
  for(const [k,x] of Object.entries(s.cells)){
    let [r,c]=k.split(',').map(Number); let p=axis==='r'?r:c;
    if(delta<0 && p===at) continue;
    if(p>at || (delta>0 && p===at)) p+=delta;
    if(axis==='r') r=p; else c=p;
    if(typeof x.v==='string' && x.v[0]==='=') x.v=adjustFormula(x.v, axis, at, delta);
    out[K(r,c)]=x;
  }
  s.cells=out;
  if(axis==='r') s.rows=Math.max(1, Math.min(MAX_ROWS, s.rows+delta)); else s.cols=Math.max(1, Math.min(MAX_COLS, s.cols+delta));
  if(s.filter && axis==='c'){ if(delta<0 && s.filter.c===at) delete s.filter; else if(s.filter.c>at || (delta>0 && s.filter.c===at)) s.filter.c+=delta; }
}
$('#sAddRow').onclick=()=>{ if(sh().rows>=MAX_ROWS) return toast('Row limit reached'); pushUndo(); shiftStructure('r', norm().r1, 1); afterChange(); };
$('#sAddCol').onclick=()=>{ if(sh().cols>=MAX_COLS) return toast('Column limit reached'); pushUndo(); shiftStructure('c', norm().c1, 1); afterChange(); };
$('#sDelRow').onclick=()=>{ const {r1,r2}=norm(); if(r2-r1+1>=sh().rows) return toast('Cannot delete every row'); pushUndo(); for(let r=r2;r>=r1;r--) shiftStructure('r', r, -1); act={r:r1,c:act.c}; ext={...act}; afterChange(); };
$('#sDelCol').onclick=()=>{ const {c1,c2}=norm(); if(c2-c1+1>=sh().cols) return toast('Cannot delete every column'); pushUndo(); for(let c=c2;c>=c1;c--) shiftStructure('c', c, -1); act={r:act.r,c:c1}; ext={...act}; afterChange(); };

/* --- Sort / filter / freeze --- */
function lastUsedRow(){ let m=-1; for(const k in sh().cells){ const r=+k.split(',')[0]; if(r>m) m=r; } return m; }
function sortRows(desc){
  const s=sh(), {r1,r2,c1}=norm(); let a=r1, b=r2;
  if(a===b){ a=s.freeze?1:0; b=lastUsedRow(); }
  if(b<=a) return toast('Nothing to sort');
  pushUndo(); recalc();
  const rows=[];
  for(let r=a;r<=b;r++){ const cells={}; for(let c=0;c<s.cols;c++){ const x=s.cells[K(r,c)]; if(x) cells[c]=x; } rows.push({from:r, key:val(r,c1), cells}); }
  const empty=v=>v==null || v==='';
  rows.sort((x,y)=>{
    const ex=empty(x.key), ey=empty(y.key); if(ex||ey) return ex-ey;
    if(isErr(x.key)) return 1; if(isErr(y.key)) return -1;
    const d=compare(x.key, y.key); return desc ? -d : d;
  });
  for(let r=a;r<=b;r++) for(let c=0;c<s.cols;c++) delete s.cells[K(r,c)];
  rows.forEach((row,i)=>{ for(const c in row.cells){ const x=row.cells[c]; if(typeof x.v==='string') x.v=offsetFormula(x.v, a+i-row.from, 0); s.cells[K(a+i,+c)]=x; } });
  afterChange(); toast(`Sorted rows ${a+1}–${b+1} by column ${colName(c1)}`);
}
$('#sSortAsc').onclick=()=>sortRows(false);
$('#sSortDesc').onclick=()=>sortRows(true);
$('#sFilter').onclick=()=>{
  const s=sh();
  if(s.filter){ delete s.filter; afterChange(); return; }
  const t=prompt(`Show only rows where column ${colName(act.c)} contains:`); if(!t) return;
  s.filter={c:act.c, text:t}; afterChange();
};
$('#sFreeze').onclick=()=>{ const s=sh(); s.freeze=!s.freeze; afterChange(); };

/* --- Sheet tabs --- */
$('#sheetTabs').addEventListener('click', e=>{ const b=e.target.closest('.stab'); if(!b) return; commitEdit(0,0,false); book.active=+b.dataset.i; act={r:0,c:0}; ext={r:0,c:0}; afterChange(); });
$('#sheetTabs').addEventListener('dblclick', e=>{ const b=e.target.closest('.stab'); if(!b) return; const s=book.sheets[+b.dataset.i]; const n=prompt('Rename sheet', s.name); if(n && n.trim()){ pushUndo(); s.name=n.trim().slice(0,31); afterChange(); } });
$('#addSheet').onclick=()=>{ pushUndo(); let i=book.sheets.length+1; while(book.sheets.some(s=>s.name==='Sheet'+i)) i++; book.sheets.push(newSheet('Sheet'+i)); book.active=book.sheets.length-1; act={r:0,c:0}; ext={r:0,c:0}; afterChange(); };
$('#delSheet').onclick=()=>{ if(book.sheets.length===1) return toast('A workbook needs at least one sheet'); if(!confirm(`Delete sheet "${sh().name}"?`)) return; pushUndo(); book.sheets.splice(book.active,1); book.active=Math.max(0,book.active-1); act={r:0,c:0}; ext={r:0,c:0}; afterChange(); };

/* --- Workbook files --- */
$('#bookList').onchange=e=>{ commitEdit(0,0,false); flushBook(); books.setActive(e.target.value); loadBook(); };
$('#bookNew').onclick=()=>{ const n=prompt('Workbook name', 'Untitled'); if(n===null) return; commitEdit(0,0,false); flushBook(); books.create(n.trim()||'Untitled'); loadBook(); };
$('#bookRename').onclick=()=>{ const n=prompt('Rename workbook', books.cur().name); if(n && n.trim()){ books.rename(n.trim()); books.fill($('#bookList')); updateStatus(); } };
$('#bookDelete').onclick=()=>{ if(!confirm(`Delete "${books.cur().name}"? This cannot be undone.`)) return; clearTimeout(bookTimer); bookTimer=null; books.remove(); loadBook(); };

$('#bookOpen').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  busy(true,'Opening '+f.name+'…');
  try{
    await need('xlsx');
    const wb=XLSX.read(await f.arrayBuffer(), {type:'array'});
    const nb={sheets:[], active:0}; let trunc=false;
    for(const name of wb.SheetNames){
      const ws=wb.Sheets[name], s=newSheet(name.slice(0,31));
      if(ws['!ref']){
        const rg=XLSX.utils.decode_range(ws['!ref']);
        let maxR=rg.e.r; if(maxR>=MAX_ROWS){ maxR=MAX_ROWS-1; trunc=true; }
        const maxC=Math.min(rg.e.c, MAX_COLS-1);
        for(let r=rg.s.r;r<=maxR;r++) for(let c=rg.s.c;c<=maxC;c++){
          const x=ws[XLSX.utils.encode_cell({r,c})]; if(!x) continue;
          let v;
          if(x.f) v='='+x.f;
          else if(x.t==='b') v=x.v?'TRUE':'FALSE';
          else if(x.t==='e') v=x.w||'#ERROR!';
          else v=x.v==null?'':String(x.v);
          const st={};
          if(x.t==='n' && x.z && typeof x.z==='string'){
            if(XLSX.SSF.is_date(x.z)) st.fmt='date';
            else if(x.z.includes('%')) st.fmt='pct';
            else if(x.z.includes('0.00')) st.fmt='num2';
          }
          if(v==='' && !st.fmt) continue;
          s.cells[K(r,c)] = st.fmt ? {v, s:st} : {v};
        }
        s.rows=Math.min(MAX_ROWS, Math.max(100, maxR+21)); s.cols=Math.min(MAX_COLS, Math.max(26, maxC+3));
      }
      nb.sheets.push(s);
    }
    if(!nb.sheets.length) nb.sheets.push(newSheet('Sheet1'));
    commitEdit(0,0,false); flushBook();
    books.create(f.name.replace(/\.(xlsx|xls|csv)$/i,''), nb); loadBook();
    toast(trunc ? `Opened – only the first ${MAX_ROWS} rows were loaded` : 'Opened '+f.name);
  }catch(err){ console.error(err); toast(String(err.message).includes('load') ? err.message : 'Could not open this file'); }
  finally{ busy(false); }
};

const FMT_Z={num2:'#,##0.00', int:'#,##0', cur:'"SAR "#,##0.00', pct:'0.00%', date:'dd-mmm-yyyy'};
$('#saveXlsx').onclick=async ()=>{
  try{ await need('xlsx'); }catch(err){ return toast(err.message); }
  commitEdit(0,0,false); flushBook();
  const wb=XLSX.utils.book_new(), used=new Set();
  book.sheets.forEach((s,i)=>{
    recalcSheet(s);
    const ws={}; let mr=0, mc=0;
    for(const [k,x] of Object.entries(s.cells)){
      if(x.v==null || x.v==='') continue;
      const [r,c]=k.split(',').map(Number), v=val(r,c), o={};
      if(typeof x.v==='string' && x.v[0]==='=' && x.v.length>1) o.f=x.v.slice(1);
      if(typeof v==='number'){ o.t='n'; o.v=v; }
      else if(typeof v==='boolean'){ o.t='b'; o.v=v; }
      else { o.t='s'; o.v= v==null ? '' : isErr(v) ? v.err : String(v); }
      const f=x.s && x.s.fmt; if(f && FMT_Z[f]) o.z=FMT_Z[f];
      ws[XLSX.utils.encode_cell({r,c})]=o; mr=Math.max(mr,r); mc=Math.max(mc,c);
    }
    ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:mr,c:mc}});
    let nm=(s.name.replace(/[\\\/?*\[\]:]/g,'_').slice(0,31)) || 'Sheet'+(i+1);
    while(used.has(nm.toLowerCase())) nm=nm.slice(0,27)+'_'+i;
    used.add(nm.toLowerCase());
    XLSX.utils.book_append_sheet(wb, ws, nm);
  });
  recalc();
  XLSX.writeFile(wb, safeName(books.cur().name)+'.xlsx');
};
$('#saveCsv').onclick=()=>{
  commitEdit(0,0,false); recalc(); const s=sh(); let mr=-1, mc=-1;
  for(const k in s.cells){ if(s.cells[k].v==null || s.cells[k].v==='') continue; const [r,c]=k.split(',').map(Number); mr=Math.max(mr,r); mc=Math.max(mc,c); }
  const lines=[];
  for(let r=0;r<=mr;r++){
    const row=[];
    for(let c=0;c<=mc;c++){
      const v=val(r,c), x=s.cells[K(r,c)], f=x && x.s && x.s.fmt;
      let t = (typeof v==='number' && f!=='date') ? String(v) : display(v, f);
      if(/[",\n\r]/.test(t)) t='"'+t.replace(/"/g,'""')+'"';
      row.push(t);
    }
    lines.push(row.join(','));
  }
  download(new Blob(['\ufeff'+lines.join('\r\n')], {type:'text/csv;charset=utf-8'}), safeName(books.cur().name)+(book.sheets.length>1?'_'+safeName(s.name):'')+'.csv');
};

/* ================================================================
   SLIDES
   ================================================================ */
const SW=1280, SH=720;                       // slide canvas = 13.333 x 7.5 in at 96 px/in
const THEMES={
  clean:{name:'Clean white', bg:'#ffffff', title:'#1d2329', text:'#3a414a', accent:'#17805a', font:'Calibri'},
  navy: {name:'Navy',        bg:'#0f2547', title:'#ffffff', text:'#d6e0f0', accent:'#f2b84b', font:'Arial'},
  dark: {name:'Charcoal',    bg:'#17191d', title:'#ffffff', text:'#c9ced6', accent:'#3ccf91', font:'Segoe UI'},
  sand: {name:'Sand',        bg:'#f6f1e7', title:'#3d2f1e', text:'#5a4a36', accent:'#c0602b', font:'Georgia'},
  ocean:{name:'Ocean',       bg:'#e9f3f8', title:'#0b3954', text:'#244a5e', accent:'#087e8b', font:'Verdana'},
};
const SIZES=[10,12,14,16,18,20,24,28,32,36,40,44,48,54,60,72,88];
const blankDeck=()=>({theme:'clean', slides:[newSlide('title')]});
const decks=new FileSet('azh.deck', blankDeck);
let deck, cur=0, selId=null, editId=null, pUndoStack=[], pRedoStack=[], deckTimer=null, stageScale=1, slideRange=null;
const stage=$('#stage'), stageWrap=$('#stageWrap');

function T(o){ return {id:uid(), type:'text', html:'', size:20, align:'left', valign:'top', ...o}; }
function newSlide(kind){
  let els=[];
  if(kind==='title') els=[T({role:'title',ph:'Click to add title',x:100,y:200,w:1080,h:170,size:48,bold:true,align:'center',valign:'bottom'}),
                          T({ph:'Click to add subtitle',x:100,y:390,w:1080,h:90,size:24,align:'center'})];
  if(kind==='content') els=[T({role:'title',ph:'Click to add title',x:60,y:36,w:1160,h:100,size:36,bold:true,valign:'middle'}),
                            T({ph:'Click to add text',x:60,y:160,w:1160,h:500,size:22,bullets:true})];
  if(kind==='two') els=[T({role:'title',ph:'Click to add title',x:60,y:36,w:1160,h:100,size:36,bold:true,valign:'middle'}),
                        T({ph:'Left column',x:60,y:160,w:560,h:500,size:20,bullets:true}),
                        T({ph:'Right column',x:660,y:160,w:560,h:500,size:20,bullets:true})];
  if(kind==='section') els=[T({role:'title',ph:'Section title',x:100,y:250,w:1080,h:130,size:44,bold:true,valign:'bottom'}),
                            T({x:112,y:396,w:180,h:10,fill:'accent',shape:'rect'}),
                            T({ph:'Optional subtitle',x:100,y:420,w:1080,h:70,size:22})];
  return {id:uid(), bg:null, notes:'', els};
}
const theme=()=>THEMES[deck.theme]||THEMES.clean;
const slideBg=s=>s.bg||theme().bg;
const colorOf=(c)=>c==='accent' ? theme().accent : c;
const elColor=e=>colorOf(e.color)||(e.role==='title'?theme().title:theme().text);
const elFont=e=>e.font||theme().font;
const curSlide=()=>deck.slides[cur];
const getEl=id=>curSlide().els.find(e=>e.id===id);
const isEmptyText=e=>e.type==='text' && !e.fill && !String(e.html||'').replace(/<[^>]*>|&nbsp;|\s/g,'') && !/<img/i.test(e.html||'');

function elHTML(e, mode){                 // mode: 'stage' | 'view'
  const box=`left:${e.x}px;top:${e.y}px;width:${e.w}px;height:${e.h}px;`;
  if(e.type==='image') return `<div class="el img" data-id="${e.id}" style="${box}"><img src="${e.src}" alt="" draggable="false"></div>`;
  if(mode==='view' && isEmptyText(e)) return '';
  let s=box+`font-size:${(e.size*4/3).toFixed(1)}px;font-family:'${elFont(e)}',sans-serif;color:${elColor(e)};text-align:${e.align||'left'};`;
  s+=`justify-content:${{top:'flex-start',middle:'center',bottom:'flex-end'}[e.valign||'top']};`;
  if(e.bold) s+='font-weight:700;'; if(e.italic) s+='font-style:italic;'; if(e.underline) s+='text-decoration:underline;';
  if(e.fill) s+=`background:${colorOf(e.fill)};`;
  if(e.line) s+=`border:2px solid ${e.line};`;
  if(e.shape==='ellipse') s+='border-radius:50%;'; else if(e.shape==='roundRect') s+='border-radius:22px;';
  const cls='el box'+(mode==='stage' && isEmptyText(e) ? ' empty' : '');
  return `<div class="${cls}" data-id="${e.id}" style="${s}"><div class="txt" data-ph="${mode==='stage'?esc(e.ph||''):''}">${e.html||''}</div></div>`;
}
function slideHTML(s, mode){ return `<div class="slide" style="background:${slideBg(s)}">${s.els.map(e=>elHTML(e,mode)).join('')}</div>`; }

function loadDeck(){
  deck=decks.load();
  if(!deck || !Array.isArray(deck.slides) || !deck.slides.length) deck=blankDeck();
  cur=0; selId=null; editId=null; pUndoStack=[]; pRedoStack=[];
  decks.fill($('#deckList'));
  if(document.body.dataset.app==='slide') renderDeck();
}
function saveDeck(){ clearTimeout(deckTimer); deckTimer=setTimeout(()=>{ deckTimer=null; if(!decks.save(deck)) toast('Storage full – use Save .pptx or Backup (large pictures use a lot of space)'); }, 400); }
function flushDeck(){ if(deckTimer){ clearTimeout(deckTimer); deckTimer=null; decks.save(deck); } }
function pushP(){ pUndoStack.push(JSON.stringify(deck)); if(pUndoStack.length>30) pUndoStack.shift(); pRedoStack=[]; }
function pUndo(){ stopTextEdit(); if(!pUndoStack.length) return toast('Nothing to undo'); pRedoStack.push(JSON.stringify(deck)); deck=JSON.parse(pUndoStack.pop()); cur=Math.min(cur,deck.slides.length-1); selId=null; changed(); }
function pRedo(){ stopTextEdit(); if(!pRedoStack.length) return; pUndoStack.push(JSON.stringify(deck)); deck=JSON.parse(pRedoStack.pop()); cur=Math.min(cur,deck.slides.length-1); selId=null; changed(); }
function changed(){ saveDeck(); renderDeck(); }

function renderDeck(){
  renderThumbs(); renderStage();
  $('#notes').value=curSlide().notes||'';
  $('#pTheme').value=deck.theme;
}
function renderThumbs(){
  $('#thumbs').innerHTML=deck.slides.map((s,i)=>`<div class="thumb${i===cur?' active':''}" data-i="${i}"><span class="tnum">${i+1}</span><div class="tview"><div class="mini">${slideHTML(s,'view')}</div></div></div>`).join('');
  $('#thumbs .active')?.scrollIntoView({block:'nearest', inline:'nearest'});
  $('#pStatus').textContent=`Slide ${cur+1} of ${deck.slides.length} · ${theme().name}`;
}
function renderThumb(i){
  const t=$(`#thumbs .thumb[data-i="${i}"] .mini`); if(t) t.innerHTML=slideHTML(deck.slides[i],'view');
}
function renderStage(){
  stage.innerHTML=slideHTML(curSlide(),'stage');
  fitStage(); paintSelection(); updatePToolbar();
}
function fitStage(){
  const box=$('#stageBox'); const aw=box.clientWidth, ah=box.clientHeight;
  if(!aw || !ah) return;
  stageScale=Math.min(aw/SW, ah/SH);
  stage.style.transform=`scale(${stageScale})`;
  stageWrap.style.width=(SW*stageScale)+'px'; stageWrap.style.height=(SH*stageScale)+'px';
}
new ResizeObserver(()=>{ if(document.body.dataset.app==='slide') fitStage(); }).observe($('#stageBox'));

const elDiv=id=>stage.querySelector(`.el[data-id="${id}"]`);
function paintSelection(){
  stage.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));
  stage.querySelectorAll('.handle').forEach(n=>n.remove());
  const d=selId && elDiv(selId); if(!d) return;
  d.classList.add('selected');
  if(editId!==selId){ const h=document.createElement('div'); h.className='handle'; d.appendChild(h); }
}
function select(id){ selId=id; paintSelection(); updatePToolbar(); }
function updatePToolbar(){
  const e=selId && getEl(selId);
  $('#pSize').value= e && e.type==='text' ? String(e.size) : '';
  $('#pFont').value= e && e.font ? e.font : '';
  $('#pBold').classList.toggle('on', !!(e && e.bold));
  $('#pItal').classList.toggle('on', !!(e && e.italic));
  $('#pUnder').classList.toggle('on', !!(e && e.underline));
  $('#pBg').value=toHex(slideBg(curSlide()))||'#ffffff';
}
function goSlide(i){ stopTextEdit(); cur=Math.max(0, Math.min(deck.slides.length-1, i)); selId=null; renderDeck(); }

/* --- Text editing inside a box --- */
function startTextEdit(id){
  const e=getEl(id); if(!e || e.type!=='text') return;
  const d=elDiv(id), t=d.querySelector('.txt');
  pushP(); editId=id; selId=id; d.classList.add('editing'); d.classList.remove('empty');
  if(isEmptyText(e) || !t.innerHTML.trim()) t.innerHTML = e.bullets ? '<ul><li><br></li></ul>' : '<div><br></div>';
  t.contentEditable='true'; t.focus();
  const r=document.createRange(); r.selectNodeContents(t); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r);
  paintSelection();
}
function stopTextEdit(){
  if(!editId) return;
  const id=editId; editId=null;
  const e=getEl(id), d=elDiv(id);
  if(e && d){
    const t=d.querySelector('.txt'); t.contentEditable='false'; d.classList.remove('editing');
    e.html = (t.textContent.trim() || t.querySelector('img')) ? t.innerHTML : '';
    if(!e.html){ t.innerHTML=''; if(isEmptyText(e)) d.classList.add('empty'); }
  }
  saveDeck(); renderThumb(cur); paintSelection();
}
stage.addEventListener('input', e=>{
  if(!editId) return; const t=e.target.closest('.txt'); const el=getEl(editId); if(!t || !el) return;
  el.html=t.innerHTML; saveDeck(); clearTimeout(stage._t); stage._t=setTimeout(()=>renderThumb(cur), 500);
});
document.addEventListener('selectionchange', ()=>{ const s=getSelection(); if(editId && s.rangeCount && stage.contains(s.anchorNode)) slideRange=s.getRangeAt(0).cloneRange(); });
function inTextCmd(cmd, val){
  const d=elDiv(editId); if(!d) return;
  const t=d.querySelector('.txt'); t.focus();
  if(slideRange && t.contains(slideRange.startContainer)){ const s=getSelection(); s.removeAllRanges(); s.addRange(slideRange); }
  document.execCommand(cmd, false, val); getEl(editId).html=t.innerHTML; saveDeck();
}

/* --- Select, move, resize (mouse and touch) --- */
stage.addEventListener('pointerdown', ev=>{
  const handle=ev.target.closest('.handle'), d=ev.target.closest('.el');
  if(!d){ stopTextEdit(); select(null); return; }
  const id=d.dataset.id;
  if(editId===id && !handle) return;                 // let the cursor move inside the text
  ev.preventDefault();
  const wasSel=selId===id;
  if(editId && editId!==id) stopTextEdit();
  if(!wasSel) select(id);
  const e=getEl(id); if(!e) return;
  const st={px:ev.clientX, py:ev.clientY, x:e.x, y:e.y, w:e.w, h:e.h}, snap=JSON.stringify(deck);
  const ratio=e.h/e.w; let moved=false;
  const node=elDiv(id);
  const mv=m=>{
    const dx=(m.clientX-st.px)/stageScale, dy=(m.clientY-st.py)/stageScale;
    if(!moved && Math.hypot(dx,dy)<4) return;
    if(!moved){ moved=true; pUndoStack.push(snap); pRedoStack=[]; }
    if(handle){
      e.w=Math.max(20, Math.round(st.w+dx));
      e.h= e.type==='image' && !m.shiftKey ? Math.round(e.w*ratio) : Math.max(10, Math.round(st.h+dy));
      node.style.width=e.w+'px'; node.style.height=e.h+'px';
    } else {
      e.x=Math.round(st.x+dx); e.y=Math.round(st.y+dy);
      node.style.left=e.x+'px'; node.style.top=e.y+'px';
    }
  };
  const up=()=>{
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    if(moved){ saveDeck(); renderThumb(cur); }
    else if(wasSel && !handle && e.type==='text') startTextEdit(id);
  };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
});
stage.addEventListener('dblclick', ev=>{ const d=ev.target.closest('.el.box'); if(d && editId!==d.dataset.id) startTextEdit(d.dataset.id); });

/* --- Keyboard --- */
document.addEventListener('keydown', ev=>{
  if(document.body.dataset.app!=='slide' || !$('#presenter').hidden) return;
  const tag=document.activeElement && document.activeElement.tagName;
  const mod=ev.ctrlKey||ev.metaKey;
  if(editId){ if(ev.key==='Escape'){ ev.preventDefault(); stopTextEdit(); } return; }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)) return;
  const k=ev.key;
  if(mod && k.toLowerCase()==='z'){ ev.preventDefault(); ev.shiftKey?pRedo():pUndo(); return; }
  if(mod && k.toLowerCase()==='y'){ ev.preventDefault(); pRedo(); return; }
  if(mod && k.toLowerCase()==='d' && selId){ ev.preventDefault(); dupEl(); return; }
  if(k==='F5'){ ev.preventDefault(); present(0); return; }
  if(k==='PageDown'){ ev.preventDefault(); goSlide(cur+1); return; }
  if(k==='PageUp'){ ev.preventDefault(); goSlide(cur-1); return; }
  if(!selId){ if(k==='ArrowDown'||k==='ArrowRight'){ goSlide(cur+1); } else if(k==='ArrowUp'||k==='ArrowLeft'){ goSlide(cur-1); } return; }
  if(k==='Delete'||k==='Backspace'){ ev.preventDefault(); delEl(); return; }
  if(k==='Escape'){ select(null); return; }
  if(k==='Enter'){ ev.preventDefault(); startTextEdit(selId); return; }
  const mv={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[k];
  if(mv){ ev.preventDefault(); const e=getEl(selId), step=ev.shiftKey?20:4; pushP(); e.x+=mv[0]*step; e.y+=mv[1]*step; const d=elDiv(selId); d.style.left=e.x+'px'; d.style.top=e.y+'px'; saveDeck(); renderThumb(cur); }
});

/* --- Toolbar --- */
$('#pSize').innerHTML='<option value="" disabled>Size</option>'+SIZES.map(s=>`<option value="${s}">${s}</option>`).join('');
$('#pTheme').innerHTML=Object.entries(THEMES).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join('');
$('#slideToolbar').addEventListener('mousedown', ev=>{ if(ev.target.closest('button')) ev.preventDefault(); });
function withEl(fn, needText){
  const e=selId && getEl(selId); if(!e){ toast('Select a text box or item first'); return; }
  if(needText && e.type!=='text') return;
  const wasEditing=editId===selId; if(wasEditing) stopTextEdit();
  pushP(); fn(e); saveDeck(); renderStage(); renderThumb(cur);
}
function styleToggle(prop, cmd){
  if(editId){ const s=getSelection(); if(s.rangeCount && !s.isCollapsed){ inTextCmd(cmd); return; } }
  withEl(e=>{ e[prop]=!e[prop]; }, true);
}
$('#pUndo').onclick=pUndo; $('#pRedo').onclick=pRedo;
$('#pBold').onclick=()=>styleToggle('bold','bold');
$('#pItal').onclick=()=>styleToggle('italic','italic');
$('#pUnder').onclick=()=>styleToggle('underline','underline');
$('#pColor').onchange=ev=>{
  if(editId && slideRange && !slideRange.collapsed){ inTextCmd('foreColor', ev.target.value); return; }
  withEl(e=>{ e.color=ev.target.value; }, true);
};
$('#pSize').onchange=ev=>withEl(e=>{ e.size=+ev.target.value; }, true);
$('#pFont').onchange=ev=>withEl(e=>{ if(ev.target.value) e.font=ev.target.value; else delete e.font; }, true);
$$('#slideToolbar [data-palign]').forEach(b=>b.onclick=()=>withEl(e=>{ e.align=b.dataset.palign; }, true));
$('#pBullets').onclick=()=>{
  if(editId){ inTextCmd('insertUnorderedList'); return; }
  withEl(e=>{
    const has=/<li/i.test(e.html||'');
    if(has){ const tmp=document.createElement('div'); tmp.innerHTML=e.html; e.html=[...tmp.querySelectorAll('li')].map(li=>`<div>${li.innerHTML}</div>`).join(''); e.bullets=false; }
    else { const paras=htmlToParas(e.html); e.html= paras.length ? '<ul>'+paras.map(p=>`<li>${p.runs.map(r=>esc(r.text)).join('')||'<br>'}</li>`).join('')+'</ul>' : ''; e.bullets=true; }
  }, true);
};
$('#pFill').onchange=ev=>withEl(e=>{ e.fill=ev.target.value; });
$('#pNoFill').onclick=()=>withEl(e=>{ delete e.fill; delete e.line; });
$('#pFront').onclick=()=>withEl(e=>{ const a=curSlide().els; a.splice(a.indexOf(e),1); a.push(e); });
$('#pBack').onclick=()=>withEl(e=>{ const a=curSlide().els; a.splice(a.indexOf(e),1); a.unshift(e); });
function delEl(){ if(!selId) return; stopTextEdit(); pushP(); const a=curSlide().els; const i=a.findIndex(e=>e.id===selId); if(i>=0) a.splice(i,1); selId=null; changed(); }
function dupEl(){ const e=getEl(selId); if(!e) return; stopTextEdit(); pushP(); const c={...JSON.parse(JSON.stringify(e)), id:uid(), x:e.x+24, y:e.y+24}; curSlide().els.push(c); selId=c.id; changed(); }
$('#pDelEl').onclick=delEl;
$('#pTheme').onchange=ev=>{ stopTextEdit(); pushP(); deck.theme=ev.target.value; changed(); };
$('#pBg').onchange=ev=>{ stopTextEdit(); pushP(); curSlide().bg=ev.target.value; changed(); };

function addEl(e){ stopTextEdit(); pushP(); curSlide().els.push(e); selId=e.id; changed(); }
$('#pText').onclick=()=>{ const e=T({x:340,y:300,w:600,h:110,size:24}); addEl(e); startTextEdit(e.id); };
$('#pShape').onchange=ev=>{ const sh=ev.target.value; ev.target.selectedIndex=0;
  addEl(T({x:490,y:235,w:300,h:250, shape:sh, fill:'accent', color:'#ffffff', size:24, align:'center', valign:'middle'})); };
$('#pImage').onchange=async ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{ const im=await shrinkImage(f, 1600, /png|gif/i.test(f.type));
    let w=Math.min(800, im.w), h=Math.round(w*im.h/im.w); if(h>560){ h=560; w=Math.round(h*im.w/im.h); }
    addEl({id:uid(), type:'image', src:im.url, x:Math.round((SW-w)/2), y:Math.round((SH-h)/2), w, h});
  }catch(err){ toast('Could not insert that picture'); } };

/* --- Slide list --- */
$('#thumbs').addEventListener('click', ev=>{ const t=ev.target.closest('.thumb'); if(t) goSlide(+t.dataset.i); });
$('#pAddSlide').onclick=()=>{ stopTextEdit(); pushP(); deck.slides.splice(cur+1, 0, newSlide($('#pLayout').value)); cur++; selId=null; changed(); };
$('#pDupSlide').onclick=()=>{ stopTextEdit(); pushP(); const c=JSON.parse(JSON.stringify(curSlide())); c.id=uid(); c.els.forEach(e=>e.id=uid()); deck.slides.splice(cur+1,0,c); cur++; selId=null; changed(); };
$('#pDelSlide').onclick=()=>{ if(deck.slides.length===1) return toast('A presentation needs at least one slide'); stopTextEdit(); pushP(); deck.slides.splice(cur,1); cur=Math.min(cur,deck.slides.length-1); selId=null; changed(); };
$('#pUp').onclick=()=>{ if(cur===0) return; stopTextEdit(); pushP(); const s=deck.slides.splice(cur,1)[0]; deck.slides.splice(cur-1,0,s); cur--; changed(); };
$('#pDown').onclick=()=>{ if(cur>=deck.slides.length-1) return; stopTextEdit(); pushP(); const s=deck.slides.splice(cur,1)[0]; deck.slides.splice(cur+1,0,s); cur++; changed(); };
$('#notes').addEventListener('input', ev=>{ curSlide().notes=ev.target.value; saveDeck(); });

/* --- Files --- */
$('#deckList').onchange=ev=>{ stopTextEdit(); flushDeck(); decks.setActive(ev.target.value); loadDeck(); };
$('#deckNew').onclick=()=>{ const n=prompt('Presentation name', 'Untitled'); if(n===null) return; stopTextEdit(); flushDeck(); decks.create(n.trim()||'Untitled'); loadDeck(); };
$('#deckRename').onclick=()=>{ const n=prompt('Rename presentation', decks.cur().name); if(n && n.trim()){ decks.rename(n.trim()); decks.fill($('#deckList')); } };
$('#deckDelete').onclick=()=>{ if(!confirm(`Delete "${decks.cur().name}"? This cannot be undone.`)) return; clearTimeout(deckTimer); deckTimer=null; editId=null; decks.remove(); loadDeck(); };

/* --- Present mode --- */
let pIndex=0;
function present(from){
  stopTextEdit(); flushDeck(); pIndex=from||0;
  const p=$('#presenter'); p.hidden=false; showPresented();
  if(p.requestFullscreen) p.requestFullscreen().catch(()=>{});
}
function showPresented(){
  const p=$('#presenter'), ps=$('#pStage');
  ps.innerHTML=slideHTML(deck.slides[pIndex],'view');
  const sc=Math.min(p.clientWidth/SW, p.clientHeight/SH);
  ps.style.transform=`scale(${sc})`; ps.style.left=((p.clientWidth-SW*sc)/2)+'px'; ps.style.top=((p.clientHeight-SH*sc)/2)+'px';
  $('#pCount').textContent=`${pIndex+1} / ${deck.slides.length}`;
}
function endPresent(){ $('#presenter').hidden=true; if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }
function pStep(d){ const n=pIndex+d; if(n<0) return; if(n>=deck.slides.length){ endPresent(); return; } pIndex=n; showPresented(); }
$('#deckPresent').onclick=()=>present(cur);
$('#pClose').onclick=ev=>{ ev.stopPropagation(); endPresent(); };
$('#presenter').addEventListener('click', ev=>{ if(ev.target.id==='pClose') return; pStep(ev.clientX < window.innerWidth*0.3 ? -1 : 1); });
document.addEventListener('keydown', ev=>{
  if($('#presenter').hidden) return;
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(ev.key)){ ev.preventDefault(); pStep(1); }
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(ev.key)){ ev.preventDefault(); pStep(-1); }
  else if(ev.key==='Escape'){ endPresent(); }
});
document.addEventListener('fullscreenchange', ()=>{ if(!document.fullscreenElement && !$('#presenter').hidden){ $('#presenter').hidden=true; } });
window.addEventListener('resize', ()=>{ if(!$('#presenter').hidden) showPresented(); });
let touchX=null;
$('#presenter').addEventListener('touchstart', ev=>{ touchX=ev.touches[0].clientX; }, {passive:true});
$('#presenter').addEventListener('touchend', ev=>{ if(touchX==null) return; const dx=ev.changedTouches[0].clientX-touchX; touchX=null; if(Math.abs(dx)>50){ ev.preventDefault(); pStep(dx<0?1:-1); } });

/* --- PDF / print: one slide per landscape page --- */
$('#deckPdf').onclick=()=>{
  stopTextEdit(); flushDeck();
  $('#printArea').innerHTML=deck.slides.map(s=>slideHTML(s,'view')).join('');
  setPageStyle('@page{size:13.333in 7.5in;margin:0}');
  document.body.classList.add('print-slides');
  toast('Choose "Save as PDF" in the print dialog'); setTimeout(()=>window.print(), 300);
};

/* --- Rich text <-> paragraphs (for PowerPoint) --- */
function htmlToParas(html){
  const box=document.createElement('div'); box.innerHTML=html||''; const paras=[]; let p=null;
  const open=b=>{ if(!p) p={runs:[], bullet:!!b}; };
  const close=()=>{ if(p){ paras.push(p); p=null; } };
  (function walk(node, st, bullet){
    for(const n of node.childNodes){
      if(n.nodeType===3){ const t=n.nodeValue.replace(/​/g,'').replace(/\s+/g,' '); if(t.trim() || (p && p.runs.length)){ open(bullet); p.runs.push({text:t, ...st}); } continue; }
      if(n.nodeType!==1) continue;
      const tag=n.tagName;
      if(tag==='BR'){ open(bullet); close(); continue; }
      const s={...st};
      if(/^(B|STRONG)$/.test(tag) || /bold|[6-9]00/.test(n.style.fontWeight)) s.bold=true;
      if(/^(I|EM)$/.test(tag) || n.style.fontStyle==='italic') s.italic=true;
      if(tag==='U' || /underline/.test(n.style.textDecoration)) s.underline=true;
      const col=n.getAttribute('color') || n.style.color; if(col) s.color=col;
      if(/^(DIV|P|LI|UL|OL|H[1-6])$/.test(tag)){ close(); walk(n, s, bullet || tag==='LI'); close(); }
      else walk(n, s, bullet);
    }
  })(box, {}, false);
  close(); return paras;
}

/* --- Save .pptx --- */
const hx=c=>(toHex(c)||'#000000').slice(1).toUpperCase();
$('#deckSave').onclick=async ()=>{
  stopTextEdit(); flushDeck(); busy(true, 'Creating PowerPoint file…');
  try{
    await need('pptx');
    const pres=new PptxGenJS(); pres.layout='LAYOUT_WIDE'; pres.title=decks.cur().name; pres.author='AZH Office';
    for(const s of deck.slides){
      const sl=pres.addSlide(); sl.background={color:hx(slideBg(s))};
      if(s.notes) sl.addNotes(s.notes);
      for(const e of s.els){
        const pos={x:e.x/96, y:e.y/96, w:e.w/96, h:e.h/96};
        if(e.type==='image'){ sl.addImage({data:e.src.replace(/^data:/,''), ...pos}); continue; }
        if(isEmptyText(e)) continue;
        const o={...pos, fontFace:elFont(e), fontSize:e.size, color:hx(elColor(e)), bold:!!e.bold, italic:!!e.italic,
                 align:e.align||'left', valign:e.valign||'top', margin:[4,6,4,6], fit:'none'};
        if(e.underline) o.underline={style:'sng'};
        if(e.fill){ o.fill={color:hx(colorOf(e.fill))}; o.shape= e.shape==='ellipse' ? pres.ShapeType.ellipse : e.shape==='roundRect' ? pres.ShapeType.roundRect : pres.ShapeType.rect; if(e.shape==='roundRect') o.rectRadius=0.2; }
        if(e.line) o.line={color:hx(e.line), width:1.5};
        const runs=[], paras=htmlToParas(e.html);
        paras.forEach((p,i)=>{
          if(!p.runs.length) p.runs=[{text:''}];
          p.runs.forEach((r,j)=>{
            const ro={};
            if(r.bold) ro.bold=true; if(r.italic) ro.italic=true; if(r.underline) ro.underline={style:'sng'};
            if(r.color) ro.color=hx(r.color);
            if(p.bullet) ro.bullet=true;
            if(j===p.runs.length-1 && i<paras.length-1) ro.breakLine=true;
            runs.push({text:r.text, options:ro});
          });
        });
        sl.addText(runs.length ? runs : '', o);
      }
    }
    await pres.writeFile({fileName: safeName(decks.cur().name)+'.pptx'});
  }catch(err){ console.error(err); toast(err.message && err.message.includes('load') ? err.message : 'Could not create the PowerPoint file'); }
  finally{ busy(false); }
};

/* --- Open .pptx (text boxes, shapes, pictures, backgrounds) --- */
function resolvePath(dir, target){
  if(target.startsWith('/')) return target.slice(1);
  const parts=dir.split('/'); for(const seg of target.split('/')){ if(seg==='..') parts.pop(); else if(seg!=='.') parts.push(seg); }
  return parts.join('/');
}
const kid=(n,tag)=>n ? [...n.children].find(c=>c.tagName===tag) : null;
const kids=(n,tag)=>n ? [...n.children].filter(c=>c.tagName===tag) : [];
function srgb(n){ if(!n) return null; const f=kid(n,'a:solidFill'); const c=f && (kid(f,'a:srgbClr')); return c ? '#'+c.getAttribute('val') : null; }
async function importPptx(file){
  await need('jszip');
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const xml=async p=>{ const f=zip.file(p); return f ? new DOMParser().parseFromString(await f.async('string'),'application/xml') : null; };
  const rels=async p=>{ const i=p.lastIndexOf('/'), dir=p.slice(0,i); const x=await xml(dir+'/_rels/'+p.slice(i+1)+'.rels'); const m={};
    if(x) for(const r of x.getElementsByTagName('Relationship')) m[r.getAttribute('Id')]={target: r.getAttribute('TargetMode')==='External' ? null : resolvePath(dir, r.getAttribute('Target')), type:r.getAttribute('Type')||''};
    return m; };
  const pres=await xml('ppt/presentation.xml'); if(!pres) throw new Error('Not a PowerPoint file');
  const prel=await rels('ppt/presentation.xml');
  const sz=pres.getElementsByTagName('p:sldSz')[0];
  const cx=+(sz && sz.getAttribute('cx'))||12192000, cy=+(sz && sz.getAttribute('cy'))||6858000;
  const sx=SW/cx, sy=SH/cy, fScale=12192000/cx;
  const paths=[...pres.getElementsByTagName('p:sldId')].map(n=>prel[n.getAttribute('r:id')]?.target).filter(Boolean);
  const out={theme:'clean', slides:[]}; let skipped=0;
  const findPh=(doc, type, idx)=>{
    if(!doc) return null;
    for(const sp of doc.getElementsByTagName('p:sp')){
      const ph=sp.getElementsByTagName('p:ph')[0]; if(!ph) continue;
      const t=ph.getAttribute('type')||'body', i=ph.getAttribute('idx');
      if((idx!=null && i===idx) || (t===type || (type==='ctrTitle'&&t==='title') || (type==='title'&&t==='ctrTitle'))){ const x=kid(kid(sp,'p:spPr'),'a:xfrm'); if(x) return x; }
    }
    return null;
  };
  for(const sp of paths){
    const doc=await xml(sp); if(!doc) continue;
    const r=await rels(sp);
    const layP=Object.values(r).find(x=>/slideLayout$/.test(x.type))?.target;
    let lay=null, mas=null;
    if(layP){ lay=await xml(layP); const lr=await rels(layP); const mp=Object.values(lr).find(x=>/slideMaster$/.test(x.type))?.target; if(mp) mas=await xml(mp); }
    const slide={id:uid(), bg:null, notes:'', els:[]};
    for(const src of [doc, lay, mas]){ const bg=src && src.getElementsByTagName('p:bg')[0]; const c=bg && srgb(kid(bg,'p:bgPr')); if(c){ slide.bg=c; break; } }
    const tree=doc.getElementsByTagName('p:spTree')[0];
    const nodes=[]; (function flat(n){ for(const c of n.children){ if(c.tagName==='p:grpSp') flat(c); else if(c.tagName==='p:sp' || c.tagName==='p:pic') nodes.push(c); } })(tree);
    for(const n of nodes){
      const spPr=kid(n,'p:spPr'); let xf=kid(spPr,'a:xfrm');
      const ph=n.getElementsByTagName('p:ph')[0], phType=ph ? (ph.getAttribute('type')||'body') : null, phIdx=ph ? ph.getAttribute('idx') : null;
      if(!xf && ph) xf=findPh(lay, phType, phIdx) || findPh(mas, phType, phIdx);
      const off=xf && kid(xf,'a:off'), ext=xf && kid(xf,'a:ext');
      const box= off && ext ? {x:Math.round(+off.getAttribute('x')*sx), y:Math.round(+off.getAttribute('y')*sy), w:Math.round(+ext.getAttribute('cx')*sx), h:Math.round(+ext.getAttribute('cy')*sy)} : {x:80,y:80,w:1120,h:200};
      if(n.tagName==='p:pic'){
        const blip=n.getElementsByTagName('a:blip')[0]; const rid=blip && blip.getAttribute('r:embed'); const path=rid && r[rid]?.target;
        const ext2=path ? path.split('.').pop().toLowerCase() : '';
        const mime={png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', bmp:'image/bmp', svg:'image/svg+xml'}[ext2];
        if(!mime || !zip.file(path)){ skipped++; continue; }
        let url='data:'+mime+';base64,'+await zip.file(path).async('base64');
        if(url.length>900000 && mime!=='image/svg+xml'){ try{ const im=await shrinkImage(await (await fetch(url)).blob(), 1600, mime==='image/png'); url=im.url; }catch(e){} }
        slide.els.push({id:uid(), type:'image', src:url, ...box}); continue;
      }
      const isTitle=phType==='title' || phType==='ctrTitle';
      const e={id:uid(), type:'text', ...box, html:'', align:'left', valign:'top', size: isTitle ? 36 : phType==='subTitle' ? 24 : 18};
      if(isTitle) e.role='title';
      const fill=srgb(spPr); if(fill) e.fill=fill;
      const ln=kid(spPr,'a:ln'); const lc=srgb(ln); if(lc) e.line=lc;
      const geom=kid(spPr,'a:prstGeom'); const pg=geom && geom.getAttribute('prst'); if(pg==='ellipse') e.shape='ellipse'; else if(pg==='roundRect') e.shape='roundRect'; else if(fill) e.shape='rect';
      const tb=kid(n,'p:txBody');
      if(tb){
        const bp=kid(tb,'a:bodyPr'); const an=bp && bp.getAttribute('anchor'); if(an==='ctr') e.valign='middle'; else if(an==='b') e.valign='bottom';
        let html='', inList=false, firstSize=null, firstAlign=null, firstFont=null;
        for(const p of kids(tb,'a:p')){
          const pPr=kid(p,'a:pPr');
          const algn=pPr && pPr.getAttribute('algn'); if(firstAlign===null) firstAlign=algn||'';
          const bullet = pPr && (kid(pPr,'a:buChar') || kid(pPr,'a:buAutoNum')) ? true : (pPr && kid(pPr,'a:buNone')) ? false : (phType==='body' || phType==='obj' || (ph && !phType));
          let inner='';
          for(const c of p.children){
            if(c.tagName==='a:br'){ inner+='<br>'; continue; }
            if(c.tagName!=='a:r' && c.tagName!=='a:fld') continue;
            const t=kid(c,'a:t'); if(!t) continue;
            const rp=kid(c,'a:rPr'); let txt=esc(t.textContent);
            if(rp){
              const szv=rp.getAttribute('sz'); if(szv && firstSize===null) firstSize=+szv/100;
              const lat=kid(rp,'a:latin'); const tf=lat && lat.getAttribute('typeface'); if(tf && !tf.startsWith('+') && !firstFont) firstFont=tf;
              if(rp.getAttribute('b')==='1') txt='<b>'+txt+'</b>';
              if(rp.getAttribute('i')==='1') txt='<i>'+txt+'</i>';
              if(rp.getAttribute('u') && rp.getAttribute('u')!=='none') txt='<u>'+txt+'</u>';
              const col=srgb(rp); if(col) txt=`<span style="color:${col}">${txt}</span>`;
            }
            inner+=txt;
          }
          if(!inner && !html) continue;
          if(bullet && inner){ if(!inList){ html+='<ul>'; inList=true; } html+=`<li>${inner}</li>`; }
          else { if(inList){ html+='</ul>'; inList=false; } html+=`<div>${inner||'<br>'}</div>`; }
        }
        if(inList) html+='</ul>';
        e.html=html.replace(/(<div><br><\/div>)+$/,'');
        if(firstSize) e.size=Math.round(firstSize*fScale);
        if(firstFont) e.font=firstFont;
        e.align={ctr:'center', r:'right', just:'left'}[firstAlign]||'left';
      }
      if(!e.html && !e.fill && !e.line) continue;
      slide.els.push(e);
    }
    out.slides.push(slide);
  }
  if(!out.slides.length) out.slides.push(newSlide('title'));
  return {deck:out, skipped};
}
$('#deckOpen').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  stopTextEdit(); flushDeck(); busy(true, 'Opening '+f.name+'…');
  try{
    const {deck:d, skipped}=await importPptx(f);
    const ok=decks.create(f.name.replace(/\.pptx$/i,''), d);
    deck=d; cur=0; selId=null; pUndoStack=[]; pRedoStack=[]; decks.fill($('#deckList')); renderDeck();
    toast(!ok ? 'Opened, but too large for browser storage – use Save .pptx to keep changes' : skipped ? `Opened (${skipped} unsupported picture${skipped>1?'s':''} skipped)` : 'Opened '+f.name);
  }catch(err){ console.error(err); toast(err.message && err.message.includes('load') ? err.message : 'Could not open this file'); }
  finally{ busy(false); }
};

/* ================================================================
   Backup / restore + startup
   ================================================================ */
function flushAll(){ flushDoc(); commitEdit(0,0,false); flushBook(); stopTextEdit(); flushDeck(); }
$('#backupBtn').onclick=()=>{
  flushAll();
  const data={app:'azh-office', version:2, date:new Date().toISOString(), docs:docs.all(), books:books.all(), decks:decks.all()};
  download(new Blob([JSON.stringify(data)], {type:'application/json'}), `azh-office-backup-${new Date().toISOString().slice(0,10)}.json`);
};
$('#restoreIn').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    const d=JSON.parse(await f.text()); if(d.app!=='azh-office') throw new Error('bad');
    flushAll(); let n=0, failed=0;
    (d.docs||[]).forEach(x=>{ if(typeof x.data==='string'){ docs.create(x.name+' (restored)', x.data) ? n++ : failed++; } });
    (d.books||[]).forEach(x=>{ if(x.data && Array.isArray(x.data.sheets)){ books.create(x.name+' (restored)', x.data) ? n++ : failed++; } });
    (d.decks||[]).forEach(x=>{ if(x.data && Array.isArray(x.data.slides)){ decks.create(x.name+' (restored)', x.data) ? n++ : failed++; } });
    loadDoc(); loadBook(); loadDeck();
    toast(`Restored ${n} file${n===1?'':'s'}`+(failed?` – ${failed} did not fit in browser storage`:''));
  }catch(err){ toast('That is not a valid AZH Office backup'); }
};
window.addEventListener('beforeunload', flushAll);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushAll(); });

loadDoc();
loadBook();
loadDeck();
showApp(['doc','sheet','slide'].includes(store.get('azh.app','doc')) ? store.get('azh.app','doc') : 'doc');
</script>
